name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Test and package against IDEA 2026.1
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace test buildPlugin 2>&1 | tee ci-build.log
      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChangeLines-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Verify IDEA 2026.1 binary compatibility
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace verifyPlugin 2>&1 | tee ci-verifier.log
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            ci-*.log
            build/reports/
            build/test-results/
