name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new GitHub Release after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Test and package against IDEA 2026.1
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace test buildPlugin 2>&1 | tee ci-build.log
      - name: Verify IDEA 2026.1 and 2026.2 binary compatibility
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace verifyPlugin 2>&1 | tee ci-verifier.log
      - name: Check installable ZIP layout and metadata
        run: python3 scripts/check_distribution.py build/distributions
      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChangeLines-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            ci-*.log
            build/reports/
            build/test-results/

  release:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ChangeLines-plugin
          path: dist
      - name: Validate the exact artifact being released
        id: metadata
        run: python3 scripts/check_distribution.py dist
      - name: Compute SHA-256 checksum
        working-directory: dist
        run: sha256sum ChangeLines-*.zip > SHA256SUMS
      - name: Publish GitHub Release without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/ChangeLines-${VERSION}.zip" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "ChangeLines $VERSION" \
            --notes-file RELEASE_NOTES.md --draft
          gh release edit "$TAG" --draft=false --latest
