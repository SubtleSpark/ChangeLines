name: Temporary README asset verification
on:
  push:
    branches: [docs/readme-asset-transfer]
permissions:
  contents: read
jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve uploaded README image for integrity checking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          url = 'https://api.github.com/repos/SubtleSpark/ChangeLines/git/blobs/fb06a6420344806f4b0e3895cc6830d1ebfd8397'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              blob = json.load(response)
          image = base64.b64decode(blob['content'])
          pathlib.Path('readme-upload.webp').write_bytes(image)
          print('Downloaded bytes:', len(image))
          print('SHA-256:', hashlib.sha256(image).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: readme-upload-verification
          path: readme-upload.webp
          retention-days: 1
