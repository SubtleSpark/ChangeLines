name: Temporary README asset verification
on:
  push:
    branches: [docs/readme-asset-transfer]
permissions:
  contents: write
jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Store checksum-verified approved README image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          api = 'https://api.github.com/repos/SubtleSpark/ChangeLines/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          req = urllib.request.Request(api + '/fb06a6420344806f4b0e3895cc6830d1ebfd8397', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              blob = json.load(response)
          encoded = base64.b64encode(base64.b64decode(blob['content'])).decode()
          # Repair a duplicated transport substring; do not alter the approved image.
          assert len(encoded) == 48180
          assert encoded[440:453] == 'DsqJh7odlRMPd'
          encoded = encoded[:440] + encoded[453:] + 'A'
          image = base64.b64decode(encoded, validate=True)
          assert len(image) == 36126
          assert hashlib.sha256(image).hexdigest() == '5267c36058cca1128af60a368ee82fe366f6a3221f9a1a6bfc8dceba598de78a'
          assert image[:4] == b'RIFF' and image[8:12] == b'WEBP'
          assert int.from_bytes(image[4:8], 'little') + 8 == len(image)
          pathlib.Path('changes-tree-overview.webp').write_bytes(image)
          request = urllib.request.Request(api, data=json.dumps({'encoding': 'base64', 'content': encoded}).encode(), headers=headers, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == '4c9830c8efb525e6926a073ce62621e4543fa8e0'
          print('Verified image blob:', result['sha'])
          print('No branch refs or releases were updated by this job.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: approved-readme-image
          path: changes-tree-overview.webp
          retention-days: 1
